name: docs-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: web

      # npm run build syncs first, then builds. web/sync-docs.mjs regenerates
      # web/src/content/docs from docs/, and web/sync-library.mjs copies the
      # generated preset library into web/public/. Both sources stay canonical
      # in the repo root; the copies under web/ are build artifacts.
      # Both are committed, so no Python or OpenSCAD is needed here.
      - name: Build site
        run: npm run build
        working-directory: web

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
