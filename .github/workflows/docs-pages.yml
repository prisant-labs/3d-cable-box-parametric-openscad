name: docs-pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A PR build must never cancel a live deploy: a push to main and the PR that
# introduced it would otherwise share one queue slot and race. Scoping the
# group by ref keeps every ref's builds serialized against themselves while
# leaving every other ref alone, and cancel-in-progress stays true for
# everything but main, where a half-deployed site is worse than a slightly
# stale queue.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: web

      # npm run build syncs first, then builds. web/sync-docs.mjs regenerates
      # web/src/content/docs from docs/, and web/sync-library.mjs copies the
      # generated preset library into web/public/. Both sources stay canonical
      # in the repo root; the copies under web/ are build artifacts.
      # Both are committed, so no Python or OpenSCAD is needed here.
      - name: Build site
        run: npm run build
        working-directory: web

      # A pull_request run still builds the site (so a dependency break, like
      # the three/model-viewer peer conflict, shows up in review) but never
      # deploys: there is nothing to configure Pages for or to hand the
      # deploy job on a branch that will not be published.
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
