site_name: Ultimate Cable Box Parametric OpenSCAD
site_description: Detailed technical documentation for cable-box-parametric.scad
site_url: https://prisant-labs.github.io/3d-cable-box-parametric-openscad/
repo_url: https://github.com/prisant-labs/3d-cable-box-parametric-openscad
repo_name: prisant-labs/3d-cable-box-parametric-openscad

docs_dir: docs

# Internal planning docs live in the repo but are not published to the site.
# exclude_docs uses .gitignore pattern syntax and implies not_in_nav.
exclude_docs: |
  internal/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started:
      - Docs Index: DOCS_INDEX.md
      - Workflows: WORKFLOWS.md
      - Printing: PRINTING.md
  - Model Reference:
      - Parameter Reference: PARAMETER_REFERENCE.md
      - Module Reference: MODULE_REFERENCE.md
      - SCAD Architecture: SCAD_ARCHITECTURE.md
      - Validation Rules: VALIDATION_RULES.md
      - Parameter Interactions: PARAMETER_INTERACTIONS.md
  - FAQ: FAQ.md
  - Release: RELEASE.md

